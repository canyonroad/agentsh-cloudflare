# agentsh Server Configuration for Cloudflare Sandbox
# v0.18.0 — ptrace (execve-only) for command control, seccomp-notify for file protection
# ptrace trace.file/network/signal must be false (v0.18.0 unix_sockets constraint)
# FUSE removed from container (mount() hangs on Firecracker)

server:
  http:
    addr: "127.0.0.1:18080"
    read_timeout: "30s"
    write_timeout: "120s"
    max_request_size: "10MB"
  grpc:
    enabled: true
    addr: "127.0.0.1:9090"

auth:
  type: "none"

logging:
  level: "info"
  format: "text"
  output: "stderr"

sessions:
  base_dir: "/var/lib/agentsh/sessions"
  max_sessions: 50
  default_timeout: "1h"
  default_idle_timeout: "15m"
  cleanup_interval: "5m"

audit:
  enabled: true
  storage:
    sqlite_path: "/var/lib/agentsh/events.db"

sandbox:
  enabled: true
  allow_degraded: true

  # FUSE mount() hangs on Firecracker — disable to force seccomp-notify for file protection
  fuse:
    enabled: false

  # Inject BASH_ENV to disable builtins that bypass seccomp
  env_inject:
    BASH_ENV: "/usr/lib/agentsh/bash_startup.sh"

  # seccomp-notify: file enforcement via seccomp_user_notify
  # seccomp-execve disabled — ptrace handles command control instead
  seccomp:
    enabled: true
    mode: "enforce"
    execve:
      enabled: false    # mutually exclusive with ptrace

  # ptrace: execve-only command control
  # trace.file/network/signal must be false (v0.18.0 unix_sockets constraint)
  ptrace:
    enabled: true
    attach_mode: "children"
    on_attach_failure: "fail_open"
    trace:
      execve: true
      file: false
      network: false
      signal: false
    performance:
      seccomp_prefilter: true
      max_tracees: 100
      max_hold_ms: 5000

proxy:
  mode: "embedded"
  port: 0
  providers:
    anthropic: "https://api.anthropic.com"
    openai: "https://api.openai.com"

dlp:
  mode: "redact"
  patterns:
    email: true
    phone: true
    credit_card: true
    ssn: true
    api_keys: true
  custom_patterns:
    - name: openai_key
      display: "[OPENAI_KEY]"
      regex: "sk-[a-zA-Z0-9]{48,}"
    - name: anthropic_key
      display: "[ANTHROPIC_KEY]"
      regex: "sk-ant-[a-zA-Z0-9-]{95,}"
    - name: aws_access_key
      display: "[AWS_KEY]"
      regex: "AKIA[0-9A-Z]{16}"
    - name: aws_secret_key
      display: "[AWS_SECRET]"
      regex: "[a-zA-Z0-9/+=]{40}"
    - name: github_pat
      display: "[GITHUB_TOKEN]"
      regex: "ghp_[a-zA-Z0-9]{36}"
    - name: github_oauth
      display: "[GITHUB_OAUTH]"
      regex: "gho_[a-zA-Z0-9]{36}"
    - name: jwt_token
      display: "[JWT]"
      regex: "eyJ[a-zA-Z0-9_-]*\\.eyJ[a-zA-Z0-9_-]*\\.[a-zA-Z0-9_-]*"
    - name: private_key
      display: "[PRIVATE_KEY]"
      regex: "-----BEGIN [A-Z]+ PRIVATE KEY-----"
    - name: slack_token
      display: "[SLACK_TOKEN]"
      regex: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"

policies:
  dir: "/etc/agentsh/policies"
  default_policy: "default"

approvals:
  enabled: false
  mode: "async"
  timeout: "5m"

metrics:
  enabled: true
  path: "/metrics"

health:
  path: "/health"
  readiness_path: "/ready"

development:
  disable_auth: true
  verbose_errors: true
